[workspace]
resolver = "3"
members = ["crates/*", "xtask", "migrate/crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/devalgupta404/HackmanX"
publish = false

[workspace.dependencies]
thiserror = "2.0"
crc32c = "0.6"
blake3 = "1.5"
gptman = { version = "3.1", default-features = false }
rustix = { version = "1", features = ["fs", "system", "mount"] }
libc = "0.2"
tempfile = "3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", default-features = false, features = ["macros"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
zbus = "6.1"
zbus_polkit = "6.0"
blocking = "1"
proptest = "1.5"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

bootshift-core = { path = "crates/core" }
bootshift-disk = { path = "crates/disk" }
bootshift-fs = { path = "crates/fs" }
bootshift-boot = { path = "crates/boot" }
bootshift-engine = { path = "crates/engine" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Lists of byte ranges are everywhere here, so one-element lists are intentional.
single_range_in_vec_init = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
# A silent integer wrap could point a copy at the wrong disk offset; aborting fails closed, and the
# journal lets the move resume. Parsers of untrusted input use checked arithmetic for a graceful
# refusal rather than relying on this.
overflow-checks = true
