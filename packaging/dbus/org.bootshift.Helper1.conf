<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Installed to /usr/share/dbus-1/system.d/. Only root may own the name; anyone may call it,
     and the service asks polkit before doing anything. -->
<busconfig>
  <policy user="root">
    <allow own="org.bootshift.Helper1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.bootshift.Helper1"
           send_interface="org.bootshift.Helper1"/>
    <allow send_destination="org.bootshift.Helper1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.bootshift.Helper1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.bootshift.Helper1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
