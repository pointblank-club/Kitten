[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "MPL-2.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
]
# Font licences, only for the crate that ships egui's built-in fonts. Fonts are data shipped
# beside the program, not code linked into it. The fonts the GUI bundles itself carry the same
# licences; their texts are in crates/gui/assets/fonts.
exceptions = [
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# Crates that appear at more than one version because independent transitive dependencies pin
# different majors. We do not pull any of these in directly and cannot unify them without forking
# upstream crates, so they are skipped from the duplicate check; the gate still fails on any NEW
# duplicate outside this list. The set is the complete list of multi-version crates in Cargo.lock
# (platform shims such as objc2*/block2/windows-sys that only duplicate off-Linux are included so
# the check is stable across targets). Revisit when dependencies are upgraded.
skip = [
    "bit-set",
    "bit-vec",
    "bitflags",
    "block2",
    "cpufeatures",
    "embedded-io",
    "foldhash",
    "getrandom",
    "hashbrown",
    "jni-sys",
    "linux-raw-sys",
    "miniz_oxide",
    "objc2",
    "objc2-app-kit",
    "objc2-foundation",
    "objc2-metal",
    "objc2-quartz-core",
    "objc2-ui-kit",
    "quick-error",
    "r-efi",
    "rand_core",
    "redox_syscall",
    "rustc-hash",
    "rustix",
    "syn",
    "thiserror",
    "thiserror-impl",
    "windows-sys",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
