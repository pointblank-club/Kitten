name: Release

# Pushing a tag like v0.1.0 or v0.1.0-alpha.1 builds the .deb, .rpm and static CLI and attaches
# them to a DRAFT GitHub release. A maintainer reviews the draft and publishes it by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NFPM_VERSION: 2.48.0
  NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750

jobs:
  release:
    # Pinned, not ubuntu-latest: bootshiftd and the GUI link against this image's glibc (2.39), so
    # the runner sets the oldest distro the packages install on. See docs/releasing.md.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y musl-tools e2fsprogs ntfs-3g efibootmgr cpio zstd kmod
      - run: rustup show active-toolchain || rustup toolchain install
      # No rust-cache here: release binaries are built from a clean tree so a poisoned cache
      # entry from a pull request can never end up in a published package.

      - name: Check the tag matches the Cargo version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "bootshift-cli") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

      - run: cargo build -p bootshift-cli --release --locked --target x86_64-unknown-linux-musl
      - run: cargo build -p bootshift-helper -p bootshift-gui --release --locked

      - name: Install nfpm
        run: |
          archive="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/${archive}"
          echo "${NFPM_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" nfpm
          sudo install -m 0755 nfpm /usr/local/bin/nfpm

      - name: Build packages
        run: |
          mkdir -p dist
          nfpm package --config packaging/nfpm.yaml --packager deb --target dist/
          nfpm package --config packaging/nfpm.yaml --packager rpm --target dist/

          cli="kitten-cli-${VERSION}-x86_64-linux-musl"
          mkdir "$cli"
          cp target/x86_64-unknown-linux-musl/release/bootshift LICENSE README.md "$cli/"
          tar -czf "dist/${cli}.tar.gz" "$cli"

          cd dist && sha256sum -- * > SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft $prerelease --verify-tag \
            --title "Kitten $VERSION" --generate-notes
